<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="biosim4-gpu">
  <!-- surface -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#fafafa"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="11.25" fill="none" stroke="#e5e5e5" stroke-width="1.5"/>

  <!-- hairline grid -->
  <g stroke="#0a0a0a" stroke-opacity="0.08" stroke-width="1">
    <line x1="20" y1="10" x2="20" y2="54"/>
    <line x1="32" y1="10" x2="32" y2="54"/>
    <line x1="44" y1="10" x2="44" y2="54"/>
    <line x1="10" y1="20" x2="54" y2="20"/>
    <line x1="10" y1="32" x2="54" y2="32"/>
    <line x1="10" y1="44" x2="54" y2="44"/>
  </g>

  <!-- glider (Game of Life): black cells, leading cell in accent emerald -->
  <g fill="#0a0a0a">
    <rect x="26" y="14" width="10" height="10" rx="1.5"/>
    <rect x="38" y="26" width="10" height="10" rx="1.5"/>
    <rect x="14" y="38" width="10" height="10" rx="1.5"/>
    <rect x="26" y="38" width="10" height="10" rx="1.5"/>
  </g>
  <rect x="38" y="38" width="10" height="10" rx="1.5" fill="#15803d"/>
</svg>
