name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/sim-wasm/**'
      - 'packages/webapp/**'
      - 'packages/core/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'cmake/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /biosim4-gpu/

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 'latest'
          actions-cache-folder: '.emsdk-cache'

      - name: Set VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Build webapp
        run: |
          cmake --preset webapp
          cmake --build --preset webapp

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/webapp/packages/webapp/dist

  publish:
    permissions:
      pages: write
      id-token: write
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
