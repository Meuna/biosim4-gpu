name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/cfgparse/**'
      - 'packages/sim-ref/**'
      - 'packages/sim-gpu/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'cmake/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'packages/core/**'
      - 'packages/cfgparse/**'
      - 'packages/sim-ref/**'
      - 'packages/sim-gpu/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'cmake/**'
      - '.github/workflows/windows.yml'

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg

    steps:
      - uses: actions/checkout@v6

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: vcpkg_installed
          key: vcpkg-windows-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ci -DBIOSIM_BUILD_GPU=OFF

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci
