name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/cfgparse/**'
      - 'packages/sim-ref/**'
      - 'packages/sim-gpu/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'cmake/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'packages/core/**'
      - 'packages/cfgparse/**'
      - 'packages/sim-ref/**'
      - 'packages/sim-gpu/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'cmake/**'
      - '.github/workflows/windows.yml'

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg

    steps:
      - uses: actions/checkout@v6

      - name: Set up MSVC x64 environment
        shell: cmd
        run: |
          for /f "delims=" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set VS_PATH=%%i
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          set >> %GITHUB_ENV%

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: vcpkg_installed
          key: vcpkg-windows-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ci -DBIOSIM_BUILD_GPU=OFF

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci
