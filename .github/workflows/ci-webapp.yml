name: Webapp CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/sim-wasm/**'
      - 'packages/webapp/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'cmake/WebappDevWorkflow.cmake'
      - '.clang-tidy'
      - '.clang-format'
      - '.github/workflows/ci-webapp.yml'
  pull_request:
    paths:
      - 'packages/sim-wasm/**'
      - 'packages/webapp/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'cmake/WebappDevWorkflow.cmake'
      - '.clang-tidy'
      - '.clang-format'
      - '.github/workflows/ci-webapp.yml'

concurrency:
  group: ci-webapp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-format-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 'latest'
          actions-cache-folder: '.emsdk-cache'

      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset webapp

      - name: Build
        run: cmake --build --preset webapp

      - name: Test
        run: bun run --cwd packages/webapp test

      - name: Format check
        run: |
          cmake --build --preset webapp --target format
          git diff --exit-code

      - name: Lint
        run: cmake --build --preset webapp --target lint
