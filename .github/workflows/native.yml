name: Native CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/cfgparse/**'
      - 'packages/sim-ref/**'
      - 'packages/sim-gpu/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'cmake/**'
      - '.clang-tidy'
      - '.clang-format'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'packages/core/**'
      - 'packages/cfgparse/**'
      - 'packages/sim-ref/**'
      - 'packages/sim-gpu/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'cmake/**'
      - '.clang-tidy'
      - '.clang-format'
      - '.github/workflows/native.yml'

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      CC: clang

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build clang clang-format clang-tidy pocl-opencl-icd

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-native-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-native-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

      - name: Lint
        run: cmake --build --preset ci --target lint

      - name: Format check
        run: |
          cmake --build --preset ci --target format
          git diff --exit-code
